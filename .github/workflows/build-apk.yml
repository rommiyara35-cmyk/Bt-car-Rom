name: Build LarkBT Switcher APK (ASR8601 lark_evb)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Debug Keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK for lark_evb Head Unit
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Ready-to-Install Car Head Unit APK
        uses: actions/upload-artifact@v4
        with:
          name: LarkBT-Switcher-ASR8601-debug
          path: app/build/outputs/apk/debug/*.apk
